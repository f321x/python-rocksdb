# vim:ts=2:sw=2:et:ai:sts=2
name: 'Build distribution'

on:
  # Run on every PR (so wheel/sdist build regressions are caught pre-merge) and
  # on pushes to main.
  pull_request:
  push:
    branches:
      - main
      - 'force_ci/all/**'     # For development, forcing all workflows to run.
      - 'force_ci/dist/**'    # For debugging and/or only forcing this workflow.

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: 'Build wheels'
    runs-on: ${{ matrix.os }}
    env:
      ROCKSDB_VER: 'v10.10.1'
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
        name: 'Checkout source repository'

      - uses: actions/setup-python@v6
        name: 'Set up Python'
        with:
          python-version: '3.12'

      - name: 'Install cibuildwheel'
        run: |
          python3 -m pip install 'cibuildwheel>=3.4.1,<4'

      - name: 'Build wheels'
        run: |
          python3 -m cibuildwheel --output-dir dist
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: 'manylinux_2_28'
          # Build CPython 3.11-3.14 (GIL-enabled; free-threaded 'cp3XXt-*' is
          # intentionally excluded until a thread-safety audit is done).
          CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux* *_i686'
          # Build & install librocksdb once in the build container. auditwheel
          # then bundles the resolved librocksdb.so into each wheel, so the
          # wheels are installable without a system RocksDB.
          CIBW_BEFORE_ALL: >
            yum install -y bzip2-devel lz4-devel snappy-devel zlib-devel
            libzstd-devel &&
            git clone https://github.com/facebook/rocksdb --depth 1
            --branch ${ROCKSDB_VER} /opt/rocksdb &&
            cd /opt/rocksdb &&
            CXXFLAGS='-flto -Os -s' PORTABLE=1 make shared_lib -j 4 &&
            make install-shared &&
            ldconfig
          # Install python package and test-deps.
          CIBW_TEST_REQUIRES: 'pytest'
          # Use `--pyargs` to interpret parameter as module to import, not as a
          # path, and do not use `python3 -m pytest`. This way we prevent
          # importing the module from the current directory instead of the
          # installed package, and failing when it cannot find the shared
          # library.
          CIBW_TEST_COMMAND: 'pytest --pyargs rocksdb'

      - uses: actions/upload-artifact@v7
        name: 'Upload build artifacts'
        with:
          name: 'wheels'
          path: 'dist/*.whl'

  build_sdist:
    name: 'Build source distribution'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
        name: 'Checkout source repository'

      - uses: actions/setup-python@v6
        name: 'Set up Python'
        with:
          python-version: '3.12'

      - name: 'Build sdist'
        run: |
          python3 -m pip install build &&
          python3 -m build --sdist

      - uses: actions/upload-artifact@v7
        name: 'Upload build artifacts'
        with:
          name: 'sdist'
          path: 'dist/*.tar.gz'


