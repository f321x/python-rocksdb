# vim:ts=2:sw=2:et:ai:sts=2
name: 'Docs'

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'force_ci/all/**'    # For development, forcing all workflows to run.
      - 'force_ci/docs/**'   # For debugging and/or only forcing this workflow.

# Least privilege for the workflow; the `deploy` job below elevates to exactly
# the scopes GitHub Pages requires.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch to save runner minutes. Deploys
# happen only on pushes to `main` (rare), and the `github-pages` environment
# serialises deployments, so cancelling a build mid-flight is safe here.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: 'Checkout source repository'

      - uses: actions/setup-python@v6
        name: 'Set up Python'
        with:
          python-version: '3.12'

      # The docs are hand-written reStructuredText (no Sphinx autodoc), so the
      # compiled extension and a system RocksDB are NOT needed to build them.
      # Install just Sphinx rather than `.[doc]`, which would pull in the
      # package and trigger a Cython/RocksDB build for no benefit here. The docs
      # use Sphinx's bundled default theme, so no theme package is needed. Keep
      # this bound in sync with the `doc` extra in setup.cfg; the cap stops a
      # new Sphinx major from breaking the `-W` (warnings-as-errors) build.
      - name: 'Build HTML docs (warnings treated as errors)'
        run: |
          python3 -m pip install 'sphinx>=7.2,<10' &&
          sphinx-build -W -b html docs docs/_build/html

      # Package the freshly built HTML as the Pages artifact for the deploy job.
      # Only needed on pushes to `main` (the one ref we publish); PRs and the
      # force_ci/* branches still run the build above purely as a CI gate.
      - uses: actions/upload-pages-artifact@v3
        name: 'Upload Pages artifact'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    name: 'Deploy to GitHub Pages'
    # Publish only the canonical site, and only from main. This deploys nowhere
    # for PRs or force_ci/* branches -- GitHub Pages serves a single live site,
    # so deploying from anything but main would clobber it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # deploy to GitHub Pages
      id-token: write    # let deploy-pages prove the deploy came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires a one-time repo setting: Settings -> Pages -> Build and
      # deployment -> Source = "GitHub Actions". No readthedocs account needed.
      - id: deployment
        name: 'Deploy'
        uses: actions/deploy-pages@v5
