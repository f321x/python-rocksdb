name: debian

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'force_ci/all/**'     # For development, forcing all workflows to run.
      - 'force_ci/debian/**'  # For debugging and/or only forcing this workflow.

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debian-build:
    name: ${{ matrix.dist }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.dist }}-slim
    strategy:
      fail-fast: false
      matrix:
        # This leg exercises the build against a *distro-packaged* librocksdb-dev
        # (the `apt install librocksdb-dev` + `pip install` path most users take),
        # as opposed to build.yml which compiles RocksDB from source. It needs a
        # distro shipping RocksDB >= 8, i.e. Debian trixie (13) or newer (trixie
        # ships RocksDB 9.10; bookworm's 7.8 is too old). We pin trixie (stable)
        # only; sid (unstable) is a rolling target that will eventually ship an
        # incompatible RocksDB and break here unpredictably.
        dist: [trixie]
    steps:
      - uses: actions/checkout@v6

      - name: Install build-dependencies
        # TODO(dato): find out why setup.py links to compression libraries
        # by hand (and hence their development packages needed here).
        run: |
          apt-get update
          # The build backend (Cython/setuptools/wheel/pkgconfig) is pulled from
          # PyPI by pip's build isolation, so only the non-Python toolchain and
          # the distro RocksDB this leg is meant to exercise are needed from apt.
          # python3-venv lets pip create its isolated build env; pkg-config (the
          # binary) is what setup.py shells out to in order to locate rocksdb.pc
          # from librocksdb-dev.
          apt-get install --no-install-recommends -y \
              build-essential librocksdb-dev pkg-config \
              python3-dev python3-pip python3-venv \
              libsnappy-dev libbz2-dev liblz4-dev libz-dev

      - name: Build pyrocksdb
        run: |
          # Debian's system Python is PEP 668 "externally managed". This is a
          # throwaway CI container, so install straight into it (--break-system-
          # packages); build isolation still provisions the pinned modern Cython
          # (>=3.2.5) from PyPI into an ephemeral env to build the extension.
          python3 -m pip install --break-system-packages -v '.[test]'

      - name: Run tests
        # Use the `pytest` console script, NOT `python3 -m pytest`: `-m` prepends
        # the repo root to sys.path, so `--pyargs rocksdb` would import the
        # un-built source-tree `rocksdb/` (no compiled `_rocksdb`) instead of the
        # installed package and fail to find the shared library. See build.yml /
        # tox.ini, which document the same convention.
        run: |
          pytest --pyargs rocksdb
