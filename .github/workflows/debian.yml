name: debian

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'force_ci/all/**'     # For development, forcing all workflows to run.
      - 'force_ci/debian/**'  # For debugging and/or only forcing this workflow.

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  debian-build:
    name: ${{ matrix.dist }}
    runs-on: ubuntu-latest
    container: debian:${{ matrix.dist }}-slim
    strategy:
      fail-fast: false
      matrix:
        # python-rocksdb 2.x requires RocksDB >= 8 and Cython >= 3, so only
        # Debian trixie (13) and newer ship compatible system packages (trixie
        # has RocksDB 9.10 and Cython 3; bookworm ships RocksDB 7.8 and Cython
        # 0.29, both too old). We test trixie (stable) only; sid (unstable) is a
        # rolling target that will eventually ship RocksDB 11 / Cython 4 and
        # break here unpredictably.
        dist: [trixie]
    steps:
      - uses: actions/checkout@v6

      - name: Install build-dependencies
        # TODO(dato): find out why setup.py links to compression libraries
        # by hand (and hence their development packages needed here).
        run: |
          apt-get update
          # With --no-build-isolation (below) pip does NOT install the build
          # backend, so setuptools/wheel must already be present from apt.
          apt-get install --no-install-recommends -y \
              build-essential librocksdb-dev cython3 python3-pkgconfig \
              python3-dev python3-pip python3-pytest \
              python3-setuptools python3-wheel \
              libsnappy-dev libbz2-dev liblz4-dev libz-dev

      - name: Build pyrocksdb
        # TODO(dato): consider using pypa/build --no-isolaiton, to
        # build the package using a tool specifically designed for
        # that, rather than trusting it to a tool that does a lot
        # more (pip).
        run: |
          # Debian's system Python is PEP 668 "externally managed". This is a
          # throwaway CI container, so install straight into it; the only sane
          # alternative (a venv) would lose access to the apt-provided cython3 /
          # pytest the job is specifically meant to exercise.
          python3 -m pip install --break-system-packages --no-build-isolation -v '.[test]'

      - name: Run tests
        run: |
          pytest-3 --pyargs rocksdb
