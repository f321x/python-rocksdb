# vim:ts=2:sw=2:et:ai:sts=2
name: 'Free-threading (ThreadSanitizer)'

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'force_ci/all/**'             # Force all workflows to run.
      - 'force_ci/freethreading/**'   # Force only this workflow.

# Cancel superseded runs on the same PR/branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Pin the toolchain the sanitised interpreter and library are built from.
  # Bump CPYTHON_REF to a newer 3.14.x tag as fixes land; ROCKSDB_REF tracks the
  # newest version exercised by build.yml.
  CPYTHON_REF: 'v3.14.0'
  ROCKSDB_REF: 'v10.10.1'
  CPYTHON_PREFIX: /opt/cpython-tsan
  LIBROCKSDB_PATH: /opt/rocksdb-tsan

jobs:
  tsan:
    name: 'ThreadSanitizer (free-threaded 3.14t)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: 'Checkout source repository'

      - name: 'Install build dependencies'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          build-essential
          libsnappy-dev libbz2-dev liblz4-dev libz-dev libgflags-dev libzstd-dev
          libssl-dev libffi-dev zlib1g-dev libreadline-dev libsqlite3-dev liblzma-dev

      # ----------------------------------------------------------------------- #
      # A free-threaded CPython built with ThreadSanitizer.                      #
      # ----------------------------------------------------------------------- #
      - uses: actions/cache@v5
        id: cache-cpython
        with:
          key: cpython-tsan-${{ env.CPYTHON_REF }}
          path: ${{ env.CPYTHON_PREFIX }}

      - name: 'Build TSan free-threaded CPython ${{ env.CPYTHON_REF }}'
        if: steps.cache-cpython.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${CPYTHON_REF}" \
            https://github.com/python/cpython /tmp/cpython
          pushd /tmp/cpython
          # --disable-gil -> free-threaded (python3.14t);
          # --with-thread-sanitizer -> compile the interpreter with -fsanitize=thread.
          ./configure --disable-gil --with-thread-sanitizer --prefix="${CPYTHON_PREFIX}"
          make -j"$(nproc)"
          make install
          popd
          # Cache CPython's canonical FT suppressions next to the install so the
          # test step can use the set matching this exact interpreter.
          cp /tmp/cpython/Tools/tsan/suppressions_free_threading.txt \
            "${CPYTHON_PREFIX}/tsan_suppressions_cpython.txt"

      - name: 'Put the sanitised interpreter on PATH'
        run: |
          echo "${CPYTHON_PREFIX}/bin" >> "$GITHUB_PATH"
          "${CPYTHON_PREFIX}/bin/python3.14t" -VV

      # ----------------------------------------------------------------------- #
      # RocksDB built with ThreadSanitizer.                                      #
      # ----------------------------------------------------------------------- #
      - uses: actions/cache@v5
        id: cache-librocksdb
        with:
          key: librocksdb-tsan-${{ env.ROCKSDB_REF }}
          path: ${{ env.LIBROCKSDB_PATH }}

      - name: 'Build TSan RocksDB ${{ env.ROCKSDB_REF }}'
        if: steps.cache-librocksdb.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/facebook/rocksdb --depth 1 \
            --branch "${ROCKSDB_REF}" "${LIBROCKSDB_PATH}"
          pushd "${LIBROCKSDB_PATH}"
          CFLAGS='-fsanitize=thread -g -O1' CXXFLAGS='-fsanitize=thread -g -O1' \
            PORTABLE=1 make shared_lib -j"$(nproc)"
          popd

      - name: 'Install the TSan RocksDB'
        run: |
          pushd "${LIBROCKSDB_PATH}"
          sudo make install-shared
          sudo ldconfig
          popd

      # ----------------------------------------------------------------------- #
      # Build the extension under TSan and run the stress suite.                 #
      # ----------------------------------------------------------------------- #
      - name: 'Build and install the extension (ThreadSanitizer)'
        env:
          CFLAGS: '-fsanitize=thread -g -O1'
          CXXFLAGS: '-fsanitize=thread -g -O1'
          LDFLAGS: '-fsanitize=thread'
        run: |
          python3.14t -m pip install --upgrade pip
          python3.14t -m pip install '.[test]'

      - name: 'Run the concurrency suite under ThreadSanitizer'
        env:
          PYTHON_GIL: '0'
          # halt_on_error so any *unsuppressed* data race fails the job.
          TSAN_OPTIONS: 'halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tsan_suppressions.txt'
        run: |
          cat "${CPYTHON_PREFIX}/tsan_suppressions_cpython.txt" \
              contrib/tsan/suppressions.txt > tsan_suppressions.txt
          # Confirm the interpreter really runs without the GIL before testing.
          # `-P` keeps the repo root off sys.path so `rocksdb` resolves to the
          # installed package, not the un-built source-tree `rocksdb/`.
          python3.14t -P -c "import rocksdb, sys; assert not sys._is_gil_enabled(), 'GIL re-enabled'"
          python3.14t -P -m pytest -v --pyargs rocksdb.tests.test_concurrency
