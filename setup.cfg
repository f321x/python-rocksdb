[metadata]
name = rocksdb
version = 2.0.0
description = Python bindings for RocksDB
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Martina Ferrari
author_email = tina@tina.pm
url = https://github.com/f321x/python-rocksdb
project_urls =
    Bug Reports = https://github.com/f321x/python-rocksdb/issues
    Repository = https://github.com/f321x/python-rocksdb
license = BSD 3-Clause License
license_files = LICENSE
keywords = rocksdb bindings
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Database

[options]
packages = find:
package_dir =
    rocksdb = rocksdb
include_package_data = True
zip_safe = False
python_requires = >=3.11

[options.packages.find]
where = .

[options.extras_require]
doc =
    sphinx>=7.2,<10
    sphinx_rtd_theme>=2.0,<4
test =
    pytest>=8

[build_sphinx]
source-dir = docs
build-dir = docs/_build
all_files = 1

[upload_sphinx]
upload-dir = docs/_build/html
